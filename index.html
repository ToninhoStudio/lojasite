<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Loja Toninho Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #111;
  color: #fff;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  background: #2575fc;
  border: none;
  color: #fff;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}

.hero {
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  padding: 60px 20px;
  text-align: center;
}

.products {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

.card img {
  width: 100%;
}

.price {
  font-size: 20px;
  font-weight: bold;
  color: #2575fc;
}

.card button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  background: #2575fc;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

/* CARRINHO */
#cart {
  position: fixed;
  top: 0;
  right: -100%;
  width: 330px;
  height: 100%;
  background: #fff;
  box-shadow: -5px 0 15px rgba(0,0,0,.2);
  padding: 20px;
  transition: .3s;
  overflow-y: auto;
  z-index: 10;
}

#cart.open {
  right: 0;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.cart-item button {
  background: red;
  border: none;
  color: white;
  border-radius: 4px;
  cursor: pointer;
  padding: 2px 6px;
}

.pay {
  margin-top: 15px;
}

.pay button, .pay a {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}

.pay .paypal {
  background: #ffc439;
  color: #111;
}

.pay .mbway {
  background: #00a859;
  color: white;
}

footer {
  text-align: center;
  padding: 20px;
  background: #111;
  color: white;
}
</style>
</head>

<body>

<header>
  <h2>🛒 Loja Toninho</h2>
  <button onclick="toggleCart()">Carrinho (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Serviços Digitais</h1>
  <p>Adicionar → Carrinho → Pagar</p>
</section>

<section class="products">
<div class="grid">

<!-- PRODUTOS -->

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%232575fc'/><text x='150' y='115' font-size='30' fill='white' text-anchor='middle'>💎 Nitro</text></svg>">
<h3>Nitro Discord</h3>
<p class="price">€5</p>
<button onclick="addToCart('Nitro Discord',5)">Comprar</button>
</div>

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%236a11cb'/><text x='150' y='115' font-size='28' fill='white' text-anchor='middle'>🎨 Logo</text></svg>">
<h3>Logo Personalizada</h3>
<p class="price">€10</p>
<button onclick="addToCart('Logo Personalizada',10)">Comprar</button>
</div>

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%2300a8ff'/><text x='150' y='115' font-size='26' fill='white' text-anchor='middle'>⚙️ Servidor</text></svg>">
<h3>Configuração Servidor</h3>
<p class="price">€15</p>
<button onclick="addToCart('Configuração Servidor',15)">Comprar</button>
</div>

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%232ecc71'/><text x='150' y='115' font-size='26' fill='white' text-anchor='middle'>💻 Scripts</text></svg>">
<h3>Fazer Scripts</h3>
<p class="price">€5</p>
<button onclick="addToCart('Fazer Scripts',5)">Comprar</button>
</div>

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%23e67e22'/><text x='150' y='115' font-size='26' fill='white' text-anchor='middle'>🖥️ Host</text></svg>">
<h3>Comprar Host</h3>
<p class="price">€5</p>
<button onclick="addToCart('Comprar Host',5)">Comprar</button>
</div>

<div class="card">
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='%239b59b6'/><text x='150' y='115' font-size='26' fill='white' text-anchor='middle'>💾 Backup</text></svg>">
<h3>Comprar Backup</h3>
<p class="price">€10</p>
<button onclick="addToCart('Comprar Backup',10)">Comprar</button>
</div>

</div>
</section>

<!-- CARRINHO -->
<div id="cart">
<h2>Carrinho</h2>
<div id="items"></div>

<h3>Total: €<span id="total">0</span></h3>

<div class="pay">
  <a id="paypalLink" class="paypal" target="_blank">Pagar com PayPal</a>
  <button class="mbway" onclick="payMBWay()">Pagar com MB Way</button>
</div>

<button onclick="toggleCart()">Fechar</button>
</div>

<footer>
© 2025 Toninho Studio
</footer>

<script>
let cart = [];
let total = 0;

function toggleCart() {
  document.getElementById('cart').classList.toggle('open');
}

function addToCart(name, price) {
  cart.push({name, price});
  total += price;
  updateCart();
  toggleCart();
}

function removeItem(index) {
  total -= cart[index].price;
  cart.splice(index,1);
  updateCart();
}

function updateCart() {
  const items = document.getElementById('items');
  items.innerHTML = '';

  cart.forEach((item,i) => {
    items.innerHTML += `
      <div class="cart-item">
        ${item.name} (€${item.price})
        <button onclick="removeItem(${i})">X</button>
      </div>
    `;
  });

  document.getElementById('total').innerText = total;
  document.getElementById('count').innerText = cart.length;

  document.getElementById('paypalLink').href =
    `https://www.paypal.me/TEUUSUARIO/${total}`;
}

function payMBWay() {
  if(total === 0) {
    alert("O carrinho está vazio.");
    return;
  }

  alert(
    "MB Way\n\n" +
    "1️⃣ Abre a app MB Way\n" +
    "2️⃣ Envia €" + total + "\n" +
    "3️⃣ Número: +351 9XXXXXXXX\n" +
    "4️⃣ Descrição: Toninho Studio\n\n" +
    "Depois envia o comprovativo."
  );
}
</script>

</body>
</html>
