<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Toninho Studio - Hosting & Loja</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== BASE ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.78)),
    url("fundo-hosting.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
  background: rgba(0,0,0,0.85);
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  color: #00f0ff;
}

header button {
  background: #00f0ff;
  border: none;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

/* ===== HERO ===== */
.hero {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 56px;
  font-weight: 900;
}

.hero h1 span {
  color: #00f0ff;
}

.hero p {
  max-width: 750px;
  font-size: 18px;
  opacity: 0.85;
}

.hero .buttons {
  margin-top: 30px;
}

.hero .buttons a {
  padding: 14px 28px;
  margin: 10px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.btn-primary {
  background: #00f0ff;
  color: #000;
}

.btn-outline {
  border: 2px solid #00f0ff;
  color: #00f0ff;
}

/* ===== PRODUTOS ===== */
.products {
  max-width: 1200px;
  margin: auto;
  padding: 60px 20px;
}

.products h2 {
  text-align: center;
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 25px;
}

.card {
  background: rgba(15,15,15,0.9);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid rgba(0,240,255,0.25);
}

.card img {
  width: 100%;
  margin-bottom: 10px;
}

.price {
  font-size: 20px;
  color: #00f0ff;
  font-weight: bold;
}

.card button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #00f0ff;
  color: #000;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

/* ===== CARRINHO ===== */
#cart {
  position: fixed;
  top: 0;
  right: -100%;
  width: 330px;
  height: 100%;
  background: #0c0c0c;
  padding: 20px;
  box-shadow: -5px 0 20px rgba(0,0,0,.7);
  transition: .3s;
  z-index: 10;
}

#cart.open {
  right: 0;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.cart-item button {
  background: red;
  border: none;
  color: white;
  border-radius: 4px;
  cursor: pointer;
  padding: 2px 6px;
}

.pay a, .pay button {
  display: block;
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}

.pay .paypal {
  background: #ffc439;
  color: #111;
}

.pay .mbway {
  background: #00a859;
  color: #fff;
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 20px;
  background: rgba(0,0,0,0.85);
}
</style>
</head>

<body>

<header>
  <h2>TONINHO STUDIO</h2>
  <button onclick="toggleCart()">Carrinho (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>HOSTING <span>FIVEM</span> & <span>MTA</span></h1>
  <p>Servidores de alta performance para sua comunidade.
     Hardware premium, proteção DDoS e suporte 24/7.</p>

  <div class="buttons">
    <a href="#produtos" class="btn-primary">COMEÇAR AGORA</a>
    <a href="#produtos" class="btn-outline">Ver Planos</a>
  </div>
</section>
